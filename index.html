<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dc0a2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <title>Pokédex</title>
    <script>
      // GitHub Pages has no SPA fallback: a direct visit or refresh of a
      // client-side route (e.g. /slopdex/pokemon/1) is answered by
      // public/404.html, which stashes the real URL in sessionStorage and
      // bounces here. Restore it before the app's module script runs —
      // createRouter() in src/router.tsx captures the initial URL at module
      // import time, so the rewrite must happen first.
      (function () {
        var key = 'slopdex:redirect'
        try {
          var redirect = sessionStorage.getItem(key)
          if (redirect) {
            sessionStorage.removeItem(key)
            if (redirect !== location.href) {
              var url = new URL(redirect, location.origin)
              if (url.origin === location.origin) {
                history.replaceState(null, '', url.pathname + url.search + url.hash)
              }
            }
          }
        } catch (e) {
          // Ignore — the app simply opens at its root.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
